<!-- templates/student/login.html -->
<!DOCTYPE html>
<html>
<head>
<title>Student Login</title>
<style>
body { font-family: Arial; background:#f5f7fa; }
.box {
    max-width:400px;
    margin:100px auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
}
input,button {
    width:100%;
    padding:10px;
    margin-top:10px;
}
button { background:#0d6efd; color:white; border:none; }
</style>
</head>

<body>

<div class="box">
<h2>Student Login</h2>

<form method="POST">
{% csrf_token %}

<input type="email" name="email" placeholder="Email" required>
<input type="text" name="phone" placeholder="Phone" required>

<button type="submit">Login</button>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

</form>
</div>

</body>
</html>
